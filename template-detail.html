<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model Benchmark Comparison</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Design language mirrors desing-ref.html: near-black ground, one orange
         accent, hairline rules, mono uppercase apparatus labels, display type.
         The reference ships dark only; the light theme is its counterpart —
         neutral paper, ink text, the same accent darkened to hold contrast. */
      :root {
        --font-sans: "Archivo", "Helvetica Neue", "Segoe UI", system-ui, -apple-system, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
        --bg: #f5f4f1;
        --bg-header: #f5f4f1;
        --bg-card: #fff;
        --bg-table-header: #efeeea;
        --bg-table-row-hover: #efeeea;
        --bg-sticky: #fff;
        --bg-highlight: #fbe4da;
        --bg-btn: #fff;
        --bg-btn-hover: #eceae5;
        --bg-select: #fff;
        --text-primary: #17181a;
        --text-secondary: #6b6760;
        --text-tertiary: #3a3c3f;
        --border: rgba(23, 24, 26, 0.12);
        --border-strong: rgba(23, 24, 26, 0.55);
        --border-select: rgba(23, 24, 26, 0.3);
        --grid: rgba(23, 24, 26, 0.08);
        --scrollbar-thumb: #c9c5bc;
        --scrollbar-thumb-hover: #a49f94;
        --accent: #cf826f;
        --accent-eyebrow: #6b6760;
        --accent-glow: rgba(216, 67, 28, 0.2);
        --radius: 3px;
        --shadow-card: none;
        --shadow-card-hover: none;
        --chart-font: #6a6e73;
        --chart-grid: rgba(23, 24, 26, 0.1);
        --atmos-line: rgba(23, 24, 26, 0.05);
        --atmos-line-2: rgba(23, 24, 26, 0.035);
        --grain: 0.035;
        /* Status + section markers are theme tokens, not fixed hex, so both
           themes stay legible on their own ground. */
        --ok: #1f7a4d;
        --warn: #b4661d;
        --err: #b3261e;
        --muted: #8b8375;
        --na: #e9e7e1;
        --dot-orange: #c0562b;
        --dot-violet: #5a4bb0;
        --dot-blue: #0e7fbf;
        --dot-green: #1f7a4d;
        --dot-red: #b3261e;
        --dot-lime: #7d9b1f;
        --dot-pink: #c0357c;
      }
      [data-theme="dark"] {
        --bg: #0a0b0c;
        --bg-header: #0a0b0c;
        --bg-card: #0e0f11;
        --bg-table-header: #101214;
        --bg-table-row-hover: #16181b;
        --bg-sticky: #0e0f11;
        --bg-highlight: #2a150e;
        --bg-btn: #0e0f11;
        --bg-btn-hover: #191b1e;
        --bg-select: #0e0f11;
        --text-primary: #eae7e0;
        --text-secondary: #9a968c;
        --text-tertiary: #c8c4bb;
        --border: rgba(234, 231, 224, 0.09);
        --border-strong: rgba(234, 231, 224, 0.34);
        --border-select: rgba(234, 231, 224, 0.2);
        --grid: rgba(234, 231, 224, 0.07);
        --scrollbar-thumb: #2c2e31;
        --scrollbar-thumb-hover: #45484c;
        --accent: #cf826f;
        --accent-eyebrow: #9a968c;
        --accent-glow: rgba(255, 90, 43, 0.28);
        --chart-grid: rgba(234, 231, 224, 0.09);
        --atmos-line: rgba(234, 231, 224, 0.04);
        --atmos-line-2: rgba(234, 231, 224, 0.028);
        --grain: 0.05;
        --ok: #6cc38a;
        --warn: #e0a35c;
        --err: #ef7a6d;
        --muted: #6f6b64;
        --na: #1a1c1e;
        --dot-orange: #ef8b52;
        --dot-violet: #a795ff;
        --dot-blue: #63c8f5;
        --dot-green: #5ec98a;
        --dot-red: #ff7a6e;
        --dot-lime: #c8e85a;
        --dot-pink: #f27ab5;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--text-primary);
        -webkit-font-smoothing: grayscale;
        -moz-osx-font-smoothing: grayscale;
        font-size: 16px;
        line-height: 1.6;
        transition:
          background 0.2s,
          color 0.2s;
      }
      ::selection {
        background: var(--accent);
        color: var(--bg);
      }

      /* Fixed atmosphere (reference's grid + film grain), behind the content boxes. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image:
          linear-gradient(to right, var(--atmos-line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--atmos-line-2) 1px, transparent 1px);
        background-size: 96px 96px;
        mask-image: radial-gradient(120% 100% at 50% 0%, #000 30%, transparent 92%);
        -webkit-mask-image: radial-gradient(120% 100% at 50% 0%, #000 30%, transparent 92%);
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: var(--grain);
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      }

      /* Scroll progress: the reference's 2px accent bar. */
      #prog {
        position: fixed;
        top: 0;
        left: 0;
        height: 2px;
        width: 0;
        background: var(--accent);
        z-index: 200;
        transition: width 0.12s linear;
      }

      /* Header: reference masthead — mono tick, display heading, hairline close. */
      .header {
        position: relative;
        z-index: 1;
        background: var(--bg-header);
        max-width: 1448px;
        margin: 0 auto;
        padding: 84px 24px 40px;
        border-bottom: 1px solid var(--border);
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      .header h1 {
        font-size: clamp(30px, 4.6vw, 58px);
        color: var(--text-primary);
        font-weight: 600;
        line-height: 1.06;
        letter-spacing: -0.04em;
        max-width: 25ch;
        margin-bottom: 12px;
      }
      .header h1 em {
        font-family: var(--font-serif);
        font-weight: 300;
        font-style: italic;
        letter-spacing: -0.015em;
      }
      .header p {
        color: var(--text-secondary);
        max-width: 62ch;
      }
      .header-line {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }
      .header-line::before {
        content: "";
        display: block;
        width: 14px;
        height: 1px;
        background: var(--accent);
      }
      .header-line::after {
        content: none;
      }
      .header-line span {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--accent-eyebrow);
      }

      /* Theme toggle — the reference's mono ghost button. */
      .theme-toggle {
        position: absolute;
        top: 20px;
        right: 24px;
        background: none;
        color: var(--text-secondary);
        border: 1px solid var(--border-select);
        padding: 9px 14px;
        border-radius: 2px;
        cursor: pointer;
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        transition:
          border-color 0.3s,
          color 0.3s;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .theme-toggle:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* Content container - sidebar + main */
      .content {
        position: relative;
        z-index: 1;
        max-width: 1448px;
        margin: 0 auto;
        padding: 32px 24px 64px;
        display: flex;
        gap: 24px;
        align-items: flex-start;
      }
      .content-main {
        flex: 1;
        min-width: 0;
      }

      /* Section titles: the reference's `.tick` — mono, tracked, accent dash. */
      .section-title {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--accent-eyebrow);
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 400;
        line-height: 1.4;
        text-transform: uppercase;
        margin: 52px 0 20px;
        letter-spacing: 0.22em;
      }
      .section-dot {
        width: 14px;
        height: 1px;
        border-radius: 0;
        flex-shrink: 0;
      }
      .dot-orange {
        background: var(--dot-orange);
      }
      .dot-violet {
        background: var(--dot-violet);
      }
      .dot-blue {
        background: var(--dot-blue);
      }
      .dot-green {
        background: var(--dot-green);
      }
      .dot-red {
        background: var(--dot-red);
      }
      .dot-lime {
        background: var(--dot-lime);
      }
      .dot-pink {
        background: var(--dot-pink);
      }

      /* Cards: white surfaces on paper, separated by hairlines, never by shadows. */
      .chart-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 20px;
      }
      .chart-box {
        /* Grid items default to min-width:auto, so a chart that keeps its own
           horizontal scroller would inflate the whole row past the viewport. */
        min-width: 0;
        background: var(--bg-card);
        border-radius: var(--radius);
        padding: 20px;
        border: 1px solid var(--border);
        transition: border-color 0.2s;
      }
      .chart-box:hover {
        border-color: var(--border-select);
      }
      .chart-box.full {
        grid-column: 1 / -1;
      }
      .chart-box h3 {
        color: var(--accent-eyebrow);
        font-family: var(--font-mono);
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        margin-bottom: 14px;
        font-weight: 400;
      }

      /* Metric cards: hairline cells on a shared top rule, no cards-in-cards. */
      .metric-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 0;
        border-top: 1px solid var(--border);
        margin-bottom: 24px;
      }
      .metric-card {
        background: none;
        padding: 18px 18px 18px 18px;
        border-bottom: 1px solid var(--border);
        border-right: 1px solid var(--border);
        border-left: 1px solid var(--border);
        text-align: left;
      }
      .metric-card .value {
        font-size: clamp(26px, 2.6vw, 38px);
        font-weight: 600;
        color: var(--text-primary);
        letter-spacing: -0.035em;
        font-variant-numeric: tabular-nums;
        line-height: 1.05;
      }
      .metric-card .label {
        font-family: var(--font-mono);
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        color: var(--accent-eyebrow);
        margin-top: 8px;
        line-height: 1.4;
      }

      /* Table styling */
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
        font-variant-numeric: tabular-nums;
      }
      th {
        background: var(--bg-table-header);
        color: var(--accent-eyebrow);
        padding: 12px;
        text-align: left;
        position: sticky;
        top: 0;
        font-family: var(--font-mono);
        font-weight: 400;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        border-bottom: 1px solid var(--border-select);
      }
      td {
        padding: 8px 12px;
        border-bottom: 1px solid var(--grid);
        color: var(--text-tertiary);
      }
      .model-col {
        min-width: 200px;
        white-space: nowrap;
      }
      tr:hover td {
        background: var(--bg-table-row-hover);
      }
      /* The reference's row hover: a hairline of accent down the leading edge. */
      tr:hover td:first-child {
        box-shadow: inset 2px 0 0 var(--accent);
      }
      th a {
        color: inherit;
        text-decoration: none;
      }
      th a:hover {
        text-decoration: underline;
      }

      /* Table scroll container */
      .table-scroll {
        max-height: 600px;
        overflow: auto;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--bg-card);
      }
      .table-scroll::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .table-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .table-scroll::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 4px;
      }
      .table-scroll::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
      }

      /* Keep sticky cell background on row hover */
      .table-scroll td.sticky-cell:hover {
        background: var(--bg-sticky);
      }

      /* Model filter sidebar - vertical left panel */
      .filter-sidebar {
        position: sticky;
        top: 24px;
        z-index: 50;
        flex-shrink: 0;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-height: calc(100vh - 48px);
        overflow-y: auto;
      }
      .filter-sidebar::-webkit-scrollbar {
        width: 4px;
      }
      .filter-sidebar::-webkit-scrollbar-track {
        background: transparent;
      }
      .filter-sidebar::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 4px;
      }
      .filter-sidebar .filter-label {
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--accent-eyebrow);
        text-transform: uppercase;
        letter-spacing: 0.22em;
        padding: 4px 6px 12px;
      }
      .filter-sidebar label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.82rem;
        color: var(--text-tertiary);
        cursor: pointer;
        padding: 4px 6px;
        border-radius: 2px;
        transition: background 0.15s;
      }
      .filter-sidebar label:hover {
        background: var(--bg-table-row-hover);
      }
      .filter-sidebar input[type="checkbox"] {
        cursor: pointer;
        accent-color: var(--accent);
        flex-shrink: 0;
      }
      .filter-sidebar label[hidden] {
        display: none;
      }
      .filter-sidebar .model-sub {
        padding-left: 22px;
        align-items: flex-start;
        font-size: 0.76rem;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }
      .filter-sidebar .color-swatch {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 0;
        flex-shrink: 0;
      }
      .filter-sidebar .btn-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 8px 6px 0;
        margin-top: 4px;
        border-top: 1px solid var(--border);
      }
      .filter-sidebar .btn {
        width: 100%;
        text-align: center;
        padding: 5px 10px;
        font-size: 0.78rem;
      }

      .filter-sidebar .caret {
        margin-left: auto;
        border: 0;
        background: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 0.7rem;
        line-height: 1;
        padding: 0 2px;
      }

      /* Status dots */
      .status-dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .status-resolved {
        background: var(--ok);
      }
      .status-unresolved {
        background: var(--warn);
      }
      .status-empty {
        background: var(--muted);
      }
      .status-error {
        background: var(--err);
      }

      /* Legend */
      .legend {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 22px;
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.06em;
        text-transform: none; /* graph legends are never rendered ALL CAPS */
        color: var(--text-secondary);
      }
      /* Same rule for Plotly's own legend (model/series names). */
      .js-plotly-plot .legend text {
        text-transform: none;
      }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      /* Highlight column: the reference's tan swatch, closed by an accent edge. */
      .table-col-highlight {
        background: var(--bg-highlight) !important;
        outline: 1px solid var(--accent);
        outline-offset: -1px;
      }

      /* Trajectory page links inside the per-instance tables */
      .traj-link {
        color: inherit;
        display: block;
        text-decoration: none;
      }
      .traj-link:hover {
        text-decoration: underline;
      }
      .section-hint {
        color: var(--text-secondary);
        font-size: 0.78rem;
        font-weight: 400;
        margin-left: 10px;
      }

      /* Scatter controls */
      .scatter-controls {
        display: flex;
        gap: 24px;
        align-items: center;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      /* Reference form motif: 2px ink border, small radius, tan focus ring. */
      .scatter-controls label {
        color: var(--accent-eyebrow);
        font-family: var(--font-mono);
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.22em;
      }
      .scatter-controls select {
        background: var(--bg-select);
        color: var(--text-tertiary);
        border: 1px solid var(--border-select);
        padding: 7px 12px;
        border-radius: 2px;
        font-size: 0.82rem;
        cursor: pointer;
      }
      .scatter-controls select:focus {
        outline: 1px solid var(--accent);
        outline-offset: 3px;
        border-color: var(--accent);
      }

      /* Failure section */
      .fail-section {
        margin-bottom: 24px;
      }
      .fail-section h3 {
        color: var(--accent-eyebrow);
        font-family: var(--font-mono);
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        font-weight: 400;
        margin-bottom: 12px;
      }

      /* Error reason checkboxes */
      .checkbox-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .checkbox-group label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.82rem;
        color: var(--text-tertiary);
        cursor: pointer;
      }
      .checkbox-group .color-swatch {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 0;
      }

      /* Error-reason panel: checkboxes beside the stacked bar chart. */
      .fail-reasons {
        display: flex;
        gap: 20px;
      }
      .error-reason-checkboxes {
        min-width: 180px;
        padding-right: 12px;
        overflow-y: auto;
        max-height: 500px;
      }
      .error-reason-chart {
        flex: 1;
        min-width: 0;
      }

      /* Buttons: the reference's mono ghost — hairline box, accent on hover. */
      .btn {
        background: none;
        color: var(--text-secondary);
        border: 1px solid var(--border-select);
        padding: 8px 14px;
        border-radius: 2px;
        cursor: pointer;
        font-family: var(--font-mono);
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        transition:
          border-color 0.3s,
          color 0.3s;
      }
      .btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* Sub-section headers: ink heading closed by a hairline rule. */
      .sub-header {
        color: var(--text-primary);
        margin: 28px 0 12px;
        padding-top: 16px;
        border-top: 1px solid var(--border-select);
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.4;
      }

      /* Sticky table cells */
      .sticky-header {
        position: sticky;
        left: 0;
        background: var(--bg-table-header);
        z-index: 2;
      }
      .sticky-cell {
        position: sticky;
        left: 0;
        background: var(--bg-sticky);
        z-index: 1;
        font-weight: 600;
      }

      .fail-no-data {
        color: var(--text-secondary);
      }

      @media (max-width: 900px) {
        .chart-row {
          grid-template-columns: 1fr;
        }
        .header {
          padding: 72px 16px 28px;
        }
        .header h1 {
          font-size: 1.75rem;
        }
        .header p {
          font-size: 0.92rem;
        }
        .theme-toggle {
          top: 12px;
          right: 12px;
          padding: 7px 10px;
        }
        .content {
          padding: 24px 16px 48px;
          flex-direction: column;
          /* Required: in column direction `flex-start` (from the base rule) would
             size .content-main to max-content and blow the page width out. */
          align-items: stretch;
        }
        .filter-sidebar {
          position: static;
          width: 100%;
          flex-direction: row;
          flex-wrap: wrap;
          max-height: 260px;
          overflow-y: auto;
          padding: 12px 16px;
          gap: 4px;
        }
        .filter-sidebar .filter-label {
          width: 100%;
          padding: 0 0 4px;
        }
        .filter-sidebar .btn-group {
          flex-direction: row;
          border-top: none;
          padding: 4px 0 0;
          width: 100%;
        }
        .filter-sidebar .btn {
          width: auto;
        }
        .chart-box {
          padding: 14px;
        }
        /* The agreement matrix is genuinely wide (one column per task), so it keeps
           its own horizontal scroller. The bar charts instead wrap their y-axis
           labels (see barAxis) so they fit the viewport without scrolling. */
        .chart-scroll-x {
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
        }
        #chart-agreement {
          min-width: 900px;
        }
        .metric-card .value {
          font-size: 1.75rem;
        }
        .section-title {
          font-size: 1.1rem;
          flex-wrap: wrap;
          margin: 32px 0 16px;
        }
        .section-hint {
          margin-left: 0;
          flex-basis: 100%;
        }
        .fail-reasons {
          flex-direction: column;
        }
        .error-reason-checkboxes {
          min-width: 0;
          max-height: 200px;
          padding-right: 0;
        }
        .error-reason-chart {
          flex: none;
        }
        .table-scroll th,
        .table-scroll td {
          padding: 5px 6px;
        }
        /* A nested vertical scroller traps touch scrolling; let the tables grow
           and the page scroll, keeping only the horizontal scroll for columns. */
        .table-scroll {
          max-height: none;
        }
        .model-col {
          min-width: 132px;
          width: 132px;
          max-width: 132px;
          white-space: normal;
          /* `anywhere` also shrinks the column's min-content width to one
             character; `break-word` wraps without touching intrinsic sizing. */
          overflow-wrap: break-word;
        }
        /* A 10px caret is untappable; `filter-sidebar` owns the base size, so the
           touch target has to be widened with the same specificity. */
        .filter-sidebar .caret {
          min-width: 30px;
          min-height: 30px;
          font-size: 0.9rem;
        }
        /* iOS Safari zooms the whole page when a focused control is under 16px. */
        .scatter-controls select {
          font-size: 16px;
        }
        .filter-sidebar input[type="checkbox"] {
          width: 20px;
          height: 20px;
        }
      }
      /* Touch devices cannot use the modebar's drag-zoom, and it covers the
         plot. Narrow desktop windows keep it: there the zoom button still
         switches the drag mode back on. */
      @media (hover: none) and (pointer: coarse) {
        .js-plotly-plot .modebar {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <button
        class="theme-toggle"
        id="theme-toggle"
        aria-label="Toggle dark/light theme"
        type="button"
      ></button>
      <div class="header-line"><span>E2Studio Benchmark Report</span></div>
      <h1>Agentic coding models <em>benchmark comparison</em></h1>
      <p>Focus on model efficiency: Tool calls and return codes analysis</p>
    </div>

    <div id="prog" aria-hidden="true"></div>
    <div class="content">
      <div id="filter-panel" class="filter-sidebar"></div>
      <div class="content-main">
        <div id="section-eval"></div>
        <div id="section-summary"></div>
        <div id="section-failures"></div>
        <div id="section-table"></div>
      </div>
    </div>

    <script>
      const DATA = {{JSON_DATA}};
      const TRAJ_LINKS_OK = new RegExp({{TRAJ_HOST_RE}}).test(location.hostname);

      // --- Theme toggle ---
      // --- Scroll progress: the reference's 2px accent bar ---
      (function() {
        const bar = document.getElementById('prog');
        function paint() {
          const max = document.documentElement.scrollHeight - window.innerHeight;
          bar.style.width = (max > 0 ? (window.scrollY / max) * 100 : 0) + '%';
        }
        window.addEventListener('scroll', paint, {passive: true});
        window.addEventListener('resize', paint);
        paint();
      })();

      // --- Theme toggle: the reference sets type, not icons. ---
      (function() {
        const btn = document.getElementById('theme-toggle');
        function setTheme(dark) {
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          btn.textContent = (dark ? 'Light mode' : 'Dark mode');
          try { localStorage.setItem('dashboard-theme', dark ? 'dark' : 'light'); } catch(e) {}
        }
        const saved = (function() {
          try { return localStorage.getItem('dashboard-theme') || localStorage.getItem('theme'); } catch(e) { return null; }
        })();
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        setTheme(saved === 'dark' || (!saved && prefersDark));
        btn.addEventListener('click', function() {
          const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
          setTheme(!isDark);
          if (window.__themeUpdateCharts) window.__themeUpdateCharts();
        });
      })();

      /* Curated per theme: the light set stays deep enough to sit on white/paper,
         the dark set bright enough to read on the warm night ground. Same hue order
         as the main dashboard, so a model keeps its identity across both pages. */
      const PALETTES = {
        light: ["#d8431c","#1f7a4d","#c0562b","#b3261e","#5a4bb0","#0e7fbf","#c9a227","#4a9a5c","#c0357c","#1f9e97","#8b8375","#d4703f","#7d9b1f","#3f9fd0","#dcc06a"],
        dark: ["#ff5a2b","#5ec98a","#ef8b52","#ff7a6e","#a795ff","#63c8f5","#f2d84a","#7ee0a0","#f27ab5","#5ee6da","#b0a894","#ff9d70","#c8e85a","#8fdcff","#f7e0a0"],
      };

      // Past the curated colors, spread hues by the golden angle so any number of models stays distinct.
      function paletteColor(i, dark) {
        const p = dark ? PALETTES.dark : PALETTES.light;
        if (i < p.length) return p[i];
        const n = i - p.length;
        const h = ((300 + n * 137.508) % 360).toFixed(1);
        return dark
          ? `hsl(${h},68%,${n % 2 ? 53 : 70}%)`
          : `hsl(${h},55%,${n % 2 ? 31 : 45}%)`;
      }

      function isDarkTheme() {
        return document.documentElement.getAttribute('data-theme') === 'dark';
      }

      const _modelColors = {};
      const _baseOrder = {};
      let _modelColorIndex = 0;
      function getModelKey(v) { return v.key.split('/')[0]; }
      function modelColor(v) {
        const mk = getModelKey(v);
        if (_modelColors[mk] === undefined) {
          const slot = _baseOrder[mk] === undefined ? _modelColorIndex++ : _baseOrder[mk];
          _modelColors[mk] = paletteColor(slot, isDarkTheme());
        }
        return _modelColors[mk];
      }
      // The palette is theme-dependent, so a theme flip re-derives every cached color.
      function refreshModelColors() {
        Object.keys(_baseOrder).forEach(b => { _modelColors[b] = paletteColor(_baseOrder[b], isDarkTheme()); });
      }

      // --- Model filter (sticky top panel) ---
      // The per-variant checkboxes are the only state; a base row just checks/
      // unchecks all of them at once, so it can never veto a ticked child.
      const visibleVariants = {};
      const openBases = {};

      // Dots carry a 1px black hairline; hovering a base or a variant in the sidebar
      // outlines its dots thicker.
      let scatterHover = null;

      function hoverHit(v) {
        return !!scatterHover && getModelKey(v) === scatterHover.base &&
          (!scatterHover.variant || v.variant === scatterHover.variant);
      }

      function scatterLine(variants, tc) {
        return {
          color: variants.map(v => hoverHit(v) ? tc.font : '#000'),
          width: variants.map(v => hoverHit(v) ? 4 : 1)
        };
      }

      function outlineScatter(hover) {
        scatterHover = hover;
        if (window.__scatterOutline) window.__scatterOutline();
      }

      function variantKey(base, variant) { return base + "\n" + variant; }

      // Sub-lines show only what the row adds over its base.
      function shortName(base, label) {
        let i = 0;
        while (i < base.length && label[i] === base[i]) i++;
        return label.slice(i).replace(/^[-_ .]+/, "") || label;
      }

      function shownVariants(base) {
        return Object.keys(DATA[base]).filter(v => DATA[base][v].summary);
      }

      function initModelFilters() {
        Object.keys(DATA).forEach((base, i) => {
          _baseOrder[base] = i;
          _modelColors[base] = paletteColor(i, isDarkTheme());
          shownVariants(base).forEach(v => { visibleVariants[variantKey(base, v)] = true; });
        });
      }

      function getFilteredVariants() {
        return getAllVariants().filter(v =>
          visibleVariants[variantKey(getModelKey(v), v.variant)] !== false);
      }

      // Apply a model filter from the URL (?filter=...) so deep links can
      // pre-select a subset of models. Case-insensitive substring match on base
      // or variant name: a matching base shows all its variants, a matching
      // variant shows only itself under its base.
      function applyUrlFilter() {
        const f = new URLSearchParams(window.location.search).get('filter');
        if (!f) return;
        const q = String(f).toLowerCase();
        const hit = s => String(s).toLowerCase().indexOf(q) !== -1;
        const keys = Object.keys(DATA);
        if (!keys.some(k => hit(k) || shownVariants(k).some(hit))) return; // no match: keep all visible
        keys.forEach(k => {
          if (!hit(k)) openBases[k] = shownVariants(k).some(hit); // matched by variant name only: reveal the children
          shownVariants(k).forEach(v => { visibleVariants[variantKey(k, v)] = hit(k) || hit(v); });
        });
      }

      function renderModelFilter() {
        const panel = document.getElementById('filter-panel');
        if (!panel) return;
        let html = '<span class="filter-label">Models:</span>';
        for (const base of Object.keys(DATA)) {
          const col = _modelColors[base] || paletteColor(0, isDarkTheme());
          const vs = shownVariants(base);
          const nvis = vs.filter(v => visibleVariants[variantKey(base, v)] !== false).length;
          const checked = nvis === vs.length;
          const open = !!openBases[base];
          const multi = vs.length > 1;
          const caret = multi ? '<button class="caret" type="button" aria-expanded="' + (open ? 'true' : 'false') + '" aria-label="Show variants">' + (open ? "\u25BE" : "\u25B8") + '</button>' : '';
          html += '<label' + (multi ? ' class="model-row" data-base="' + esc(base) + '" onclick="toggleBaseRow(event, this)"' : '') + ' data-hover-base="' + esc(base) + '"><input type="checkbox" data-base="' + esc(base) + '"' + (checked ? ' checked' : '') + (nvis && nvis < vs.length ? ' data-partial="1"' : '') + ' onchange="toggleModelFilter(this)"><span class="color-swatch" style="background:' + col + ';"></span>' + esc(base) + caret + '</label>';
          // Single-model bases need no sub-line.
          if (multi) for (const v of vs) {
            const label = shortName(base, shortLabel(DATA[base][v]));
            html += '<label class="model-sub" data-hover-base="' + esc(base) + '" data-hover-variant="' + esc(v) + '"' + (open ? '' : ' hidden') + '><input type="checkbox" data-base="' + esc(base) + '" data-variant="' + esc(v) + '"' + (visibleVariants[variantKey(base, v)] !== false ? ' checked' : '') + ' onchange="toggleModelFilter(this)">' + esc(label) + '</label>';
          }
        }
        html += '<div class="btn-group">';
        html += '<button class="btn" onclick="setAllModelFilters(true)" type="button">Check all</button>';
        html += '<button class="btn" onclick="setAllModelFilters(false)" type="button">Uncheck all</button>';
        html += '</div>';
        var top = panel.scrollTop;
        setHtml(panel, html);
        panel.scrollTop = top; // the panel re-renders on every toggle: keep the scroll position
        panel.querySelectorAll('input[data-base]').forEach(cb => { cb.indeterminate = cb.getAttribute('data-partial') === '1'; });
        panel.querySelectorAll('label[data-hover-base]').forEach(l => {
          const hover = {base: l.getAttribute('data-hover-base'), variant: l.getAttribute('data-hover-variant')};
          l.addEventListener('mouseenter', () => outlineScatter(hover));
          l.addEventListener('mouseleave', () => outlineScatter(null));
        });
      }

      function toggleModelFilter(cb) {
        const base = cb.getAttribute('data-base');
        const variant = cb.getAttribute('data-variant');
        if (variant === null) {
          // Children always mirror their base, rolled out or collapsed.
          shownVariants(base).forEach(v => { visibleVariants[variantKey(base, v)] = cb.checked; });
        } else visibleVariants[variantKey(base, variant)] = cb.checked;
        renderAll();
      }

      // Children start collapsed; the caret only reveals them, checks still filter.
      function toggleBaseOpen(base) {
        openBases[base] = !openBases[base];
        renderModelFilter();
      }

      // On a base with children, only the checkbox checks: clicking the text or
      // the caret rolls the children out instead.
      function toggleBaseRow(ev, label) {
        if (ev.target.tagName === 'INPUT') return;
        ev.preventDefault();
        toggleBaseOpen(label.getAttribute('data-base'));
      }

      function setAllModelFilters(checked) {
        for (const base of Object.keys(DATA)) {
          shownVariants(base).forEach(v => { visibleVariants[variantKey(base, v)] = checked; });
        }
        renderAll();
      }

      // Preserve scatter axis selection across model-filter re-renders
      const _scatterState = { x: 'rc_ratio', y: 'score', size: 'total_tools' };

      function saveScatterState() {
        const xEl = document.getElementById('scatter-x-axis');
        const yEl = document.getElementById('scatter-y-axis');
        const sEl = document.getElementById('scatter-size');
        if (xEl) _scatterState.x = xEl.value;
        if (yEl) _scatterState.y = yEl.value;
        if (sEl) _scatterState.size = sEl.value;
      }

      function restoreScatterState() {
        const xEl = document.getElementById('scatter-x-axis');
        const yEl = document.getElementById('scatter-y-axis');
        const sEl = document.getElementById('scatter-size');
        if (xEl) xEl.value = _scatterState.x;
        if (yEl) yEl.value = _scatterState.y;
        if (sEl) sEl.value = _scatterState.size;
      }

      function renderAll() {
        saveScatterState();
        renderModelFilter();
        renderSummary(document.getElementById('section-summary'));
        renderFailures(document.getElementById('section-failures'));
        renderTable(document.getElementById('section-table'));
        restoreScatterState();
        if (window.__updateScatterPlot) window.__updateScatterPlot();
      }

      function shortLabel(v) {
        let label = v.model;
        const pm = label.match(/^(.+)\s+\((.+)\)$/);
        if (pm) {
          label = pm[1] + ' ' + pm[2];
        }
        label = label.replace(/notag/g, '');
        label = label.replace(/_WQ(\w+)_CQ(\w+)/g, ' $1 $2');
        return label;
      }

      // Plotly's `automargin` paints long y-axis labels over the plot instead of
      // reserving room for them. An uncapped gutter also starves the bars: a
      // 388px label column in a 514px chart leaves a 106px plot. So the gutter is
      // budgeted against the visible width, labels are wrapped over several
      // lines, and the tick font shrinks until both fit.
      function isNarrow() {
        return window.innerWidth < 900;
      }

      function wrapLabel(label, max) {
        const lines = [];
        let cur = '';
        for (let word of String(label).split(/\s+/)) {
          while (word.length > max) {
            const at = word.lastIndexOf('-', max);
            const cut = at > 0 ? at + 1 : max;
            lines.push(word.slice(0, cut));
            word = word.slice(cut);
          }
          if (cur && (cur + ' ' + word).length > max) { lines.push(cur); cur = word; }
          else cur = cur ? cur + ' ' + word : word;
        }
        if (cur) lines.push(cur);
        return lines;
      }

      const _measure = document.createElement('canvas').getContext('2d');
      function widestPx(lines, size) {
        _measure.font = size + "px " + chartFontFamily;
        return lines.reduce((m, l) => Math.max(m, _measure.measureText(l).width), 0);
      }

      // { labels, tick, margin, height } for a horizontal bar chart's y-axis: the
      // largest tick font and the narrowest wrapped-label gutter that fit the
      // container, plus the height every row needs at that font. Resizes the plot
      // div so the box and the plot agree, then Plotly's responsive resize follows.
      function barAxis(divId, labels) {
        const div = document.getElementById(divId);
        const narrow = isNarrow();
        const width = div && div.clientWidth ? div.clientWidth : window.innerWidth;
        const budget = Math.round(width * (narrow ? 0.4 : 0.5));
        const minRow = narrow ? 28 : 25;
        // Unwrapped first, then progressively tighter wraps: only wrap as much as
        // the budget needs, and never past four lines.
        const widths = [Infinity, ...Array.from({ length: 15 }, (_, i) => 24 - i)];
        for (const tick of [12, 11, 10, 9, 8]) {
          const lineH = Math.ceil(tick * 1.25);
          for (const max of widths) {
            const wrapped = labels.map(l => wrapLabel(l, max));
            const lines = wrapped.reduce((m, l) => Math.max(m, l.length), 1);
            if (lines > 4) continue;
            const needed = Math.round(widestPx(wrapped.reduce((a, l) => a.concat(l), []), tick)) + 12;
            if (needed <= budget) {
              return finish(wrapped, tick, needed, Math.max(minRow, lines * lineH + 2));
            }
          }
        }
        // Nothing fits the budget: wrap hard at the smallest font and let the rows
        // grow rather than let the gutter swallow the plot.
        const wrapped = labels.map(l => wrapLabel(l, 10));
        const lines = wrapped.reduce((m, l) => Math.max(m, l.length), 1);
        return finish(wrapped, 8, budget, Math.max(minRow, lines * 10 + 2));
        function finish(wrapped, tick, margin, rowH) {
          const height = Math.max(150, labels.length * rowH);
          if (div) div.style.height = height + 'px';
          return { labels: wrapped.map(l => l.join('<br>')), tick, margin, height };
        }
      }

      // Same as the main dashboard: parse the markup once and move the nodes in, instead
      // of handing a raw HTML string to the panel.
      function setHtml(el, html) {
        el.replaceChildren(...new DOMParser().parseFromString(html, 'text/html').body.children);
      }

      function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

      // Repeat runs of the same config ("-run2") compound into one bar: the mean value,
      // min/max whiskers, and the run count in the tooltip.
      const RUN_TAG = /-?run\d+(?=[\s_]|$)/i;

      function compoundBars(variants, value) {
        const groups = new Map();
        variants.forEach(v => {
          const gk = v.key.replace(RUN_TAG, '');
          if (!groups.has(gk)) groups.set(gk, { v: v, vals: [] });
          groups.get(gk).vals.push(value(v));
        });
        return Array.from(groups.values()).map(function(g){
          const vals = g.vals;
          return {
            v: g.v, label: shortLabel(g.v).replace(RUN_TAG, ''),
            avg: vals.reduce((s, x) => s + x, 0) / vals.length,
            min: Math.min.apply(null, vals), max: Math.max.apply(null, vals), count: vals.length,
          };
        }).sort((a, b) => b.avg - a.avg);
      }

      // One horizontal bar chart: colour-coded by base model, whiskers spanning the runs.
      function barChart(divId, groups, title, fmt, textSize) {
        const axis = barAxis(divId, groups.map(g => g.label));
        const tc = getThemeColors();
        Plotly.newPlot(divId, [{
          type: 'bar', orientation: 'h', y: axis.labels, x: groups.map(g => g.avg),
          error_x: {
            type: 'data', symmetric: false,
            array: groups.map(g => g.max - g.avg), arrayminus: groups.map(g => g.avg - g.min),
            color: tc.accent, thickness: 1.5, width: 4
          },
          marker: { color: groups.map(g => modelColor(g.v)) },
          text: groups.map(g => fmt(g.avg)), textposition: 'outside', textfont: { size: textSize },
          customdata: groups.map(g => [g.min, g.max, g.count]),
          hovertemplate: '<b>%{y}</b><br>' + title + ' avg: %{x:.1f}<br>min: %{customdata[0]:.1f}'
            + '<br>max: %{customdata[1]:.1f}<br>runs: %{customdata[2]}<extra></extra>'
        }], { ...commonLayout(axis.margin, title, axis.tick), showlegend: false }, PLOT_CONFIG);
      }

      function getAllVariants() {
        const variants = [];
        for (const [model, vmap] of Object.entries(DATA)) {
          for (const [variant, data] of Object.entries(vmap)) {
            if (data.summary) variants.push({ model: data.model, variant, data, key: model + '/' + variant });
          }
        }
        return variants;
      }

      function getThemeColors() {
        const cs = getComputedStyle(document.documentElement);
        const v = (n, fb) => cs.getPropertyValue(n).trim() || fb;
        return {
          font: v('--chart-font', '#3b372f'),
          grid: v('--chart-grid', '#e0dacd'),
          tableHeader: v('--bg-table-header', '#f6f3ec'),
          stickyBg: v('--bg-sticky', '#fff'),
          accent: v('--accent', '#8a6a2f'),
          eyebrow: v('--accent-eyebrow', '#b08d58'),
          card: v('--bg-card', '#fff'),
          ok: v('--ok', '#1f7a4d'),
          warn: v('--warn', '#b4661d'),
          err: v('--err', '#b3261e'),
          muted: v('--muted', '#8b8375'),
          na: v('--na', '#efece4'),
          fontFamily: v('--font-sans', 'Figtree, Inter, sans-serif'),
        };
      }
      var chartFontFamily = getThemeColors().fontFamily;

      /* Diverging heat ramp for the per-instance tables: green at the low tail,
         red at the high tail. Built from the theme's status tokens so the numbers
         stay readable on paper and on the night ground alike. */
      function heatRamp(tc) {
        const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
        const lo = rgb(tc.ok), hi = rgb(tc.err);
        return {
          muted: tc.muted,
          ramp: t => 'rgb(' + lo.map((c, i) => Math.round(c + (hi[i] - c) * t)).join(',') + ')',
        };
      }

      // Tooltips sit on the card surface, so they take the theme's ink, not a fixed black.
      function hoverLabel(tc) {
        return { bgcolor: tc.card, bordercolor: tc.accent, font: { color: tc.font, size: 12 } };
      }
      // The modebar only appears on hover, so on touch it sits permanently over the
      // top of the chart. The getter re-reads the width on every render.
      const PLOT_CONFIG = {
        responsive: true,
        get displayModeBar() { return !isNarrow(); },
      };

      function commonLayout(leftMargin, xTitle, yTick) {
        const tc = getThemeColors();
        return {
          paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
          font: { color: tc.font, family: chartFontFamily },
          margin: { t: isNarrow() ? 30 : 10, r: 20, b: 40, l: leftMargin || 140 },
          // Without this, a one-finger drag inside a tall chart zoom-selects
          // instead of scrolling the page.
          dragmode: isNarrow() ? false : 'zoom',
          xaxis: { gridcolor: tc.grid, title: xTitle || '' },
          yaxis: Object.assign({ gridcolor: tc.grid }, yTick ? { tickfont: { size: yTick } } : {}),
          // A vertical legend sits beside the plot, which a phone cannot spare.
          legend: isNarrow()
            ? { orientation: 'h', x: 0, xanchor: 'left', y: 1.02, yanchor: 'bottom', bgcolor: 'rgba(0,0,0,0)', font: { color: tc.font, size: 10 } }
            : { bgcolor: 'rgba(0,0,0,0)', font: { color: tc.font } },
          hoverlabel: hoverLabel(tc)
        };
      }

      function renderSummary(panel) {
        const variants = getFilteredVariants();
        const hoverTraceLabel = Object.assign(hoverLabel(getThemeColors()), { namelength: -1, align: 'left' });

        let html = '<div class="section-title"><div class="section-dot dot-violet"></div>Summary</div>';
        html += '<div class="metric-row">';
        html += '<div class="metric-card"><div class="value">' + variants.length + '</div><div class="label">Models/Variants Compared</div></div>';
        html += '<div class="metric-card"><div class="value">' +
          variants.reduce((s, v) => s + (v.data.summary.total_trajectories || 0), 0) +
          '</div><div class="label">Total Trajectories</div></div>';
        html += '<div class="metric-card"><div class="value">' +
          variants.reduce((s, v) => s + (v.data.total_tools || 0), 0) +
          '</div><div class="label">Total Tool Calls</div></div>';
        html += '</div>';

        html += '<div class="chart-row">';
        html += '<div class="chart-box full"><h3>Scatter Plot</h3>';
        html += '<div class="scatter-controls">';
        html += '<div><label>X Axis: </label><select id="scatter-x-axis"><option value="score">Score</option><option value="total_tools">Total Tool Calls</option><option value="total_nonzero_rc">Total Non-Zero RC</option><option value="rc_ratio" selected>Non-Zero RC Ratio</option></select></div>';
        html += '<div><label>Y Axis: </label><select id="scatter-y-axis"><option value="score" selected>Score</option><option value="total_tools">Total Tool Calls</option><option value="total_nonzero_rc">Total Non-Zero RC</option><option value="rc_ratio">Non-Zero RC Ratio</option></select></div>';
        html += '<div><label>Size: </label><select id="scatter-size"><option value="total_tools">Total Tool Calls</option><option value="total_nonzero_rc">Total Non-Zero RC</option><option value="rc_ratio">Non-Zero RC Ratio</option></select></div>';
        html += '</div>';
        html += '<div id="chart-scatter" style="height:500px;"></div></div>';
        html += '</div>';


        let evalChartData = null;
        const evalVariants = variants.filter(v => v.data.eval);
        if (evalVariants.length) {
          const sortedEval = evalVariants.slice().sort((a, b) => (a.data.eval.resolved || 0) - (b.data.eval.resolved || 0));
          html += '<div class="chart-row">';
          html += '<div class="chart-box full"><h3>Task Resolution Breakdown by Variant</h3><div id="eval-stacked"></div></div>';
          html += '</div>';
          evalChartData = sortedEval.map(v => ({ label: shortLabel(v), resolved: v.data.eval.resolved || 0, unresolved: v.data.eval.unresolved || 0, empty_patch: v.data.eval.empty_patch || 0, error: v.data.eval.error || 0 }));
        }

        const cumVariants = variants.filter(v => v.data.table && v.data.eval);
        if (cumVariants.length) {
          html += '<div class="chart-row">';
          html += '<div class="chart-box full"><h3>Cumulative Solved Tasks vs Cumulative Requests</h3><div id="chart-cumulative" style="height:500px;"></div></div>';
          html += '</div>';
        }

        const ecdfVariants = variants.filter(v => v.data.table && v.data.table.length);
        if (ecdfVariants.length) {
          html += '<div class="chart-row">';
          html += '<div class="chart-box full"><h3>ECDF of Per-Task Request Counts</h3><div id="chart-ecdf" style="height:500px;"></div></div>';
          html += '</div>';
        }

        const agmtVariants = variants.filter(v => v.data.eval && v.data.eval.instance_status && Object.keys(v.data.eval.instance_status).length > 0);
        if (agmtVariants.length) {
          html += '<div class="chart-row">';
          html += '<div class="chart-box full"><h3>Agreement Matrix (solve patterns)</h3><div class="chart-scroll-x"><div id="chart-agreement"></div></div></div>';
          html += '</div>';
          html += '<div class="chart-row">';
          html += '<div class="chart-box full"><h3>Agreement Histogram (tasks by number of variants that solved them)</h3><div id="chart-agreement-hist" style="height:320px;"></div></div>';
          html += '</div>';
        }
        html += '<div class="chart-row">';
        html += '<div class="chart-box full"><h3>Total Tool Calls by Variant (lower is better)</h3><div id="chart-tools"></div></div>';
        html += '</div>';
        html += '<div class="chart-row">';
        html += '<div class="chart-box"><h3>Total Non-Zero RC by Variant (lower is better)</h3><div id="chart-rc"></div></div>';
        html += '<div class="chart-box"><h3>Non-Zero RC Ratio (%) (lower is better)</h3><div id="chart-rcpct"></div></div>';
        html += '</div>';

        setHtml(panel, html);


        if (agmtVariants.length) {
          // Cluster tasks so identical solve-patterns (tuple of per-model statuses) are adjacent.
          const agmtStatusIdx = { resolved: 0, unresolved: 1, empty_patch: 2, error: 3 };
          const agmtStatusName = ['Resolved', 'Unresolved', 'Empty Patch', 'Error', 'N/A'];
          const agmtSet = new Set();
          agmtVariants.forEach(v => Object.keys(v.data.eval.instance_status || {}).forEach(i => agmtSet.add(i)));
          const agmtPattern = inst => agmtVariants.map(v => (v.data.eval.instance_status || {})[inst] || 'none').join('|');
          const agmtGroups = new Map();
          agmtSet.forEach(inst => {
            const p = agmtPattern(inst);
            if (!agmtGroups.has(p)) agmtGroups.set(p, []);
            agmtGroups.get(p).push(inst);
          });
          const agmtOrdered = Array.from(agmtGroups.entries())
            .sort((a, b) => a[0].localeCompare(b[0]))
            .flatMap(([p, list]) => list.sort((a, b) => {
              const na = parseInt(a.replace('django__django-', ''), 10);
              const nb = parseInt(b.replace('django__django-', ''), 10);
              return ((isNaN(na) ? 0 : na) - (isNaN(nb) ? 0 : nb));
            }));

          const agmtAxis = barAxis('chart-agreement', agmtVariants.map(v => shortLabel(v)));
          const agmtY = agmtAxis.labels;
          const agmtX = agmtOrdered.map(i => i.replace('django__django-', ''));
          const agmtZ = agmtVariants.map(v => agmtOrdered.map(inst => {
            const st = (v.data.eval.instance_status || {})[inst];
            return st !== undefined ? agmtStatusIdx[st] : 4;
          }));
          const agmtText = agmtVariants.map(v => agmtOrdered.map(inst => {
            const st = (v.data.eval.instance_status || {})[inst];
            return st !== undefined ? agmtStatusName[agmtStatusIdx[st]] : 'N/A';
          }));
          const agmtTc = getThemeColors();
          const agmtColorscale = [
            [0, agmtTc.ok], [0.2, agmtTc.ok],
            [0.2, agmtTc.warn], [0.4, agmtTc.warn],
            [0.4, agmtTc.muted], [0.6, agmtTc.muted],
            [0.6, agmtTc.err], [0.8, agmtTc.err],
            [0.8, agmtTc.na], [1, agmtTc.na]
          ];
          Plotly.newPlot('chart-agreement', [{
            type: 'heatmap',
            z: agmtZ,
            x: agmtX,
            y: agmtY,
            text: agmtText,
            colorscale: agmtColorscale,
            zmin: 0, zmax: 5,
            showscale: false,
            hovertemplate: '%{y}<br><b>%{x}</b> : %{text}<extra></extra>'
          }], {
            paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
            font: { color: agmtTc.font, family: chartFontFamily },
            margin: { t: 10, r: 20, b: 60, l: agmtAxis.margin },
            xaxis: { gridcolor: agmtTc.grid, title: 'Tasks (clustered by solve pattern)', type: 'category', tickmode: 'array', tickvals: agmtX.filter((_, i) => i % 10 === 0), ticktext: agmtX.filter((_, i) => i % 10 === 0), tickangle: -90, tickfont: { size: 9 } },
            yaxis: { gridcolor: agmtTc.grid, title: 'Models', tickfont: { size: agmtAxis.tick } },
            hoverlabel: hoverLabel(agmtTc),
            dragmode: false,
          }, PLOT_CONFIG);

          const agmtN = agmtVariants.length;
          const agmtHist = Array(agmtN + 1).fill(0);
          agmtOrdered.forEach(inst => {
            const solved = agmtVariants.filter(v => (v.data.eval.instance_status || {})[inst] === 'resolved').length;
            agmtHist[solved]++;
          });
          const agmtHistX = agmtHist.map((_, i) => i);
          const agmtHistLabels = agmtHistX.map(i => i === agmtN ? (i + ' (all)') : String(i));
          Plotly.newPlot('chart-agreement-hist', [{
            type: 'bar',
            x: agmtHistX,
            y: agmtHist,
            text: agmtHist,
            textposition: 'outside',
            marker: { color: agmtHistX.map(i => i === agmtN ? agmtTc.ok : agmtTc.accent) },
            hovertemplate: '%{x} variant(s) solved: %{y} task(s)<extra></extra>'
          }], {
            paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
            font: { color: agmtTc.font, family: chartFontFamily },
            margin: { t: 10, r: 20, b: 50, l: 50 },
            xaxis: { gridcolor: agmtTc.grid, title: 'Number of variants that solved the task', tickmode: 'array', tickvals: agmtHistX, ticktext: agmtHistLabels },
            yaxis: { gridcolor: agmtTc.grid, title: 'Number of tasks' },
            hoverlabel: hoverLabel(agmtTc),
            dragmode: isNarrow() ? false : 'zoom',
          }, PLOT_CONFIG);
        }

        if (cumVariants.length) {
          const cumTraces = cumVariants.map(v => {
            const status = v.data.eval.instance_status || {};
            let reqs = 0, solved = 0;
            const xs = [], ys = [];
            for (const r of (v.data.table || [])) {
              reqs += r.api;
              if (status[r.instance] === 'resolved') solved++;
              xs.push(reqs);
              ys.push(solved);
            }
            return {
              type: 'scatter', mode: 'lines', name: shortLabel(v),
              x: xs, y: ys,
              line: { color: modelColor(v), width: 2 },
              hoverinfo: 'name',
              hoverlabel: hoverTraceLabel
            };
          });
          const cumLayout = Object.assign(commonLayout(70, 'Cumulative Requests (API calls)'),
            // One legend entry per variant: unusable at phone width.
            isNarrow() ? { showlegend: false } : {});
          cumLayout.yaxis = Object.assign({}, cumLayout.yaxis, { title: 'Cumulative Solved Tasks' });
          Plotly.newPlot('chart-cumulative', cumTraces, cumLayout, PLOT_CONFIG);
        }

        if (ecdfVariants.length) {
          const ecdfTraces = ecdfVariants.map(v => {
            const counts = v.data.table.map(r => r.api).sort((a, b) => a - b);
            const n = counts.length;
            return {
              type: 'scatter', mode: 'lines', name: shortLabel(v),
              x: counts, y: counts.map((_, i) => (i + 1) / n),
              line: { color: modelColor(v), width: 2 },
              hoverinfo: 'name',
              hoverlabel: hoverTraceLabel
            };
          });
          const ecdfLayout = Object.assign(commonLayout(70, 'Requests (API calls) per task'),
            isNarrow() ? { showlegend: false } : {});
          ecdfLayout.yaxis = Object.assign({}, ecdfLayout.yaxis, { title: 'Cumulative fraction of tasks' });
          Plotly.newPlot('chart-ecdf', ecdfTraces, ecdfLayout, PLOT_CONFIG);
        }

        if (evalChartData) {
          const axis = barAxis('eval-stacked', evalChartData.map(e => e.label));
          const evalLabels = axis.labels;
          const est = getThemeColors();
          Plotly.newPlot('eval-stacked', [
            { type: 'bar', orientation: 'h', name: 'Resolved', y: evalLabels, x: evalChartData.map(e => e.resolved), marker: { color: est.ok } },
            { type: 'bar', orientation: 'h', name: 'Unresolved', y: evalLabels, x: evalChartData.map(e => e.unresolved), marker: { color: est.warn } },
            { type: 'bar', orientation: 'h', name: 'Empty Patch', y: evalLabels, x: evalChartData.map(e => e.empty_patch), marker: { color: est.muted } },
            { type: 'bar', orientation: 'h', name: 'Error', y: evalLabels, x: evalChartData.map(e => e.error), marker: { color: est.err } }
          ], { ...commonLayout(axis.margin, '', axis.tick), barmode: 'stack' }, PLOT_CONFIG);
        }

        barChart('chart-tools', compoundBars(variants, v => v.data.total_tools || 0),
          'Total Tool Calls', n => n.toLocaleString(), 11);
        barChart('chart-rc', compoundBars(variants, v => v.data.total_nonzero_rc || 0),
          'Total Non-Zero RC', n => n.toLocaleString(), 9);
        barChart('chart-rcpct', compoundBars(variants, v => (v.data.total_tools ? v.data.total_nonzero_rc / v.data.total_tools * 100 : 0)),
          'RC Ratio %', n => n.toFixed(2) + '%', 10);

        const scatterVariants = variants.filter(v => (v.data.eval && (v.data.eval.resolved || 0) > 0));

        function getAxisValue(v, axis) {
          switch (axis) {
            case 'score': return v.data.eval ? v.data.eval.resolved || 0 : 0;
            case 'total_tools': return v.data.total_tools || 0;
            case 'total_nonzero_rc': return v.data.total_nonzero_rc || 0;
            case 'rc_ratio': return v.data.total_tools ? v.data.total_nonzero_rc / v.data.total_tools * 100 : 0;
            default: return 0;
          }
        }

        function getAxisTitle(axis) {
          switch (axis) {
            case 'score': return 'Score (Resolved)';
            case 'total_tools': return 'Total Tool Calls';
            case 'total_nonzero_rc': return 'Total Non-Zero RC';
            case 'rc_ratio': return 'Non-Zero RC Ratio (%)';
            default: return '';
          }
        }

        function updateScatterPlot() {
          const xAxis = document.getElementById('scatter-x-axis').value;
          const yAxis = document.getElementById('scatter-y-axis').value;
          const sizeAxis = document.getElementById('scatter-size').value;

          const scatterX = scatterVariants.map(v => getAxisValue(v, xAxis));
          const scatterY = scatterVariants.map(v => getAxisValue(v, yAxis));
          const scatterSizes = scatterVariants.map(v => getAxisValue(v, sizeAxis));

          const minSize = 8;
          const maxSize = 40;
          const sMin = Math.min(...scatterSizes);
          const sMax = Math.max(...scatterSizes);
          const sRange = sMax - sMin || 1;
          const markerSizes = scatterSizes.map(s => minSize + (maxSize - minSize) * ((s - sMin) / sRange));

          const xMin = Math.min(...scatterX);
          const xMax = Math.max(...scatterX);
          const xPad = (xMax - xMin) * 0.3 || 1;
          const yMin = Math.min(...scatterY);
          const yMax = Math.max(...scatterY);
          const yPad = (yMax - yMin) * 0.3 || 1;

          const stc = getThemeColors();
          Plotly.newPlot('chart-scatter', [{
            type: 'scatter', mode: 'markers', x: scatterX, y: scatterY,
            text: scatterVariants.map(v => shortLabel(v)), hoverinfo: 'text',
            hoverlabel: hoverLabel(stc),
            marker: { size: markerSizes, color: scatterVariants.map(v => modelColor(v)), line: scatterLine(scatterVariants, stc) }
          }], { ...commonLayout(60), margin: { t: 10, r: 20, b: 80, l: 60 },
            xaxis: { ...commonLayout().xaxis, title: getAxisTitle(xAxis), type: 'linear', range: [Math.max(0, xMin - xPad), xMax + xPad] },
            yaxis: { ...commonLayout().yaxis, title: getAxisTitle(yAxis), type: 'linear', range: [Math.max(0, yMin - yPad), yMax + yPad] }
          }, PLOT_CONFIG);

          window.__scatterOutline = () => {
            const line = scatterLine(scatterVariants, stc);
            Plotly.restyle('chart-scatter', {'marker.line.color': [line.color], 'marker.line.width': [line.width]});
          };
        }

        updateScatterPlot();
        document.getElementById('scatter-x-axis').addEventListener('change', updateScatterPlot);
        document.getElementById('scatter-y-axis').addEventListener('change', updateScatterPlot);
        document.getElementById('scatter-size').addEventListener('change', updateScatterPlot);
        window.__updateScatterPlot = updateScatterPlot;
      }

      function renderFailures(panel) {
        const variants = getFilteredVariants().filter(v => v.data.failures);

        if (!variants.length) {
          panel.innerHTML = '<div class="section-title"><div class="section-dot dot-red"></div>Failures</div><p class="fail-no-data">No failure data available.</p>';
          return;
        }

        let html = '';

        const allReasons = {};
        variants.forEach(v => {
          for (const [reason, count] of Object.entries(v.data.failures.reasons || {})) {
            if (!allReasons[reason]) allReasons[reason] = [];
            allReasons[reason].push({ label: shortLabel(v), v, count });
          }
        });
        const sortedReasons = Object.entries(allReasons).sort((a, b) => b[1].reduce((s, e) => s + e.count, 0) - a[1].reduce((s, e) => s + e.count, 0));

        const variantTotals = variants.map(v => {
          let total = 0;
          for (const entries of Object.values(allReasons)) {
            const entry = entries.find(e => e.v === v);
            if (entry) total += entry.count;
          }
          return { v, total };
        });
        variantTotals.sort((a, b) => b.total - a.total);
        let reasonsHtml = '<div class="section-title"><div class="section-dot dot-orange"></div>Error Details by Reason</div>';
        reasonsHtml += '<div class="chart-row">';
        reasonsHtml += '<div class="chart-box full">';
        reasonsHtml += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">';
        reasonsHtml += '<button class="btn" onclick="uncheckAllErrorReasons()">Uncheck all</button>';
        reasonsHtml += '<button class="btn" onclick="checkAllErrorReasons()">Check all</button>';
        reasonsHtml += '</div>';
        reasonsHtml += '<div class="fail-reasons">';
        reasonsHtml += '<div id="error-reason-checkboxes" class="checkbox-group error-reason-checkboxes"></div>';
        reasonsHtml += '<div id="error-reason-chart" class="error-reason-chart"></div>';
        reasonsHtml += '</div></div></div>';

        // Set all markup at once to avoid += re-parsing and destroying Plotly state
        setHtml(panel, html + reasonsHtml);

        // Measured once the panel is in the DOM, so the gutter and height use the
        // chart's real width.
        const reasonAxis = barAxis('error-reason-chart', variantTotals.map(vt => shortLabel(vt.v)));

        // Failure reasons share the model palette: same hues, same theme rules.
        const reasonColors = Array.from({ length: 15 }, (_, i) => paletteColor(i, isDarkTheme()));

        const checkboxesEl = document.getElementById('error-reason-checkboxes');
        sortedReasons.forEach(([reason], idx) => {
          const cbId = 'cb-reason-' + idx;
          const col = reasonColors[idx % reasonColors.length];
          checkboxesEl.innerHTML += '<label><input type="checkbox" id="' + cbId + '" checked onchange="toggleErrorReason(' + idx + ', this.checked)"><span class="color-swatch" style="background:' + col + ';"></span>' + esc(reason) + '</label>';
        });

        const traces = sortedReasons.map(([reason, entries], idx) => {
          const lookup = {};
          entries.forEach(e => { lookup[e.v.key] = e.count; });
          const counts = variantTotals.map(vt => lookup[vt.v.key] || 0);
          return {
            type: 'bar', orientation: 'h', y: reasonAxis.labels, x: counts,
            name: reason,
            marker: { color: reasonColors[idx % reasonColors.length] },
            visible: true
          };
        });

        const tc = getThemeColors();
        Plotly.newPlot('error-reason-chart', traces, {
          paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
          font: { color: tc.font, family: chartFontFamily },
          margin: { t: 10, r: 20, b: 40, l: reasonAxis.margin },
          xaxis: { gridcolor: tc.grid, title: 'Count', type: 'linear' },
          yaxis: { gridcolor: tc.grid, tickfont: { size: reasonAxis.tick } },
          barmode: 'stack',
          legend: { bgcolor: 'rgba(0,0,0,0)', font: { color: tc.font }, visible: false, clicktolayoutattributes: [{ visible: false }] },
          hoverlabel: hoverLabel(tc),
          dragmode: isNarrow() ? false : 'zoom',
        }, PLOT_CONFIG);

        window.toggleErrorReason = function(idx, checked) {
          const el = document.getElementById('error-reason-chart');
          if (!el) return;
          Plotly.restyle(el, { visible: checked }, [idx]);
        };

        window.uncheckAllErrorReasons = function() {
          sortedReasons.forEach((_, idx) => {
            const cb = document.getElementById('cb-reason-' + idx);
            if (cb) cb.checked = false;
          });
          const el = document.getElementById('error-reason-chart');
          if (el) Plotly.restyle(el, { visible: false });
        };

        window.checkAllErrorReasons = function() {
          sortedReasons.forEach((_, idx) => {
            const cb = document.getElementById('cb-reason-' + idx);
            if (cb) cb.checked = true;
          });
          const el = document.getElementById('error-reason-chart');
          if (el) Plotly.restyle(el, { visible: true });
        };

        const gd = document.getElementById('error-reason-chart');
        gd.on('plotly_legendclick', function(data) {
          const allTraces = data.data || [];
          const reasons = sortedReasons.map(([r]) => r);
          reasons.forEach((reason, i) => {
            const cb = document.getElementById('cb-reason-' + i);
            if (cb) cb.checked = allTraces[i] && allTraces[i].visible !== false;
          });
        });
      }

      function renderTable(panel) {
        const variants = getFilteredVariants();

        const lookup = {};
        const allInstances = new Set();
        const allToolValues = [];
        variants.forEach(v => {
          (v.data.table || []).forEach(r => {
            lookup[r.instance] = lookup[r.instance] || {};
            lookup[r.instance][v.key] = { tools: r.tools, nonzero_rc: r.nonzero_rc };
            allInstances.add(r.instance);
            allToolValues.push(r.tools);
          });
        });

        const allRcValues = [];
        variants.forEach(v => {
          (v.data.table || []).forEach(r => {
            allRcValues.push(r.nonzero_rc);
          });
        });

        const toolMin = Math.min(...allToolValues);
        const toolMax = Math.max(...allToolValues);
        const sorted = allToolValues.slice().sort((a, b) => a - b);
        const bottom20Idx = Math.floor(sorted.length * 0.2);
        const top20Idx = Math.ceil(sorted.length * 0.8);
        const bottomThreshold = bottom20Idx > 0 ? sorted[bottom20Idx - 1] : sorted[0];
        const topThreshold = top20Idx < sorted.length ? sorted[top20Idx] : sorted[sorted.length - 1];
        const toolHeat = heatRamp(getThemeColors());
        function toolColor(val) {
          if (val >= bottomThreshold && val <= topThreshold) return toolHeat.muted;
          return toolHeat.ramp(allToolValues.length > 1 ? (val - toolMin) / (toolMax - toolMin) : 0);
        }

        const instances = Array.from(allInstances).sort((a, b) => {
          const na = parseInt(a.replace('django__django-', ''));
          const nb = parseInt(b.replace('django__django-', ''));
          return na - nb;
        });

        let html = '<div class="section-title"><div class="section-dot dot-blue"></div>Per-Instance Table';
        html +=
          '<span class="section-hint">Click a model row or a value column to highlight it'
          + (TRAJ_LINKS_OK ? ' · click a value to open its trajectory page' : '')
          + '</span></div>';

        const trajLink = (v, inst, inner, title) => {
          const href = TRAJ_LINKS_OK ? (v.data.traj || {})[inst] : undefined;
          return href
            ? '<a class="traj-link" href="' + href + '" title="' + esc(title) + '">' + inner + '</a>'
            : inner;
        };

        const evalVariants = variants.filter(v => v.data.eval);
        if (evalVariants.length) {
          const statusColors = {
            resolved: 'status-resolved',
            unresolved: 'status-unresolved',
            empty_patch: 'status-empty',
            error: 'status-error'
          };

          html += '<div class="sub-header">Task Status</div>';
          html += '<div class="table-scroll" id="table-scroll-status"><table class="sync-table"><thead><tr>';
          html += '<th class="model-col sticky-header" data-col="0">Model</th>';
          instances.forEach((inst, ci) => {
            const short = inst.replace('django__django-', '');
            html += '<th data-col="' + (ci + 1) + '"><a href="https://huggingface.co/datasets/princeton-nlp/SWE-bench_Verified/viewer/default/test?views%5B%5D=test&sql=SELECT+*+FROM+test+WHERE+instance_id+%3D+%27'+inst+'%27">' + short + '</a></th>';
          });
          html += '</tr></thead><tbody>';

          variants.forEach(v => {
            html += '<tr><td class="model-col sticky-cell" data-col="0">' + esc(shortLabel(v)) + '</td>';
            const status = v.data.eval && v.data.eval.instance_status || {};
            instances.forEach(inst => {
              const st = status[inst];
              if (st) {
                html +=
                  '<td style="text-align:center;">' +
                  trajLink(v, inst, '<span class="status-dot ' + statusColors[st] + '"></span>', inst + ' · ' + shortLabel(v)) +
                  '</td>';
              } else {
                html += '<td></td>';
              }
            });
            html += '</tr>';
          });
          html += '</tbody></table></div>';

          html += '<div class="legend">';
          html += '<span class="legend-item"><span class="status-dot status-resolved"></span> Resolved</span>';
          html += '<span class="legend-item"><span class="status-dot status-unresolved"></span> Unresolved</span>';
          html += '<span class="legend-item"><span class="status-dot status-empty"></span> Empty Patch</span>';
          html += '<span class="legend-item"><span class="status-dot status-error"></span> Error</span>';
          html += '</div>';
        }

        html += '<div class="sub-header">Tool Calls</div>';
        html += '<div class="table-scroll" id="table-scroll-tools"><table class="sync-table"><thead><tr>';
        html += '<th class="model-col sticky-header" data-col="0">Model</th>';
        instances.forEach((inst, ci) => {
          const short = inst.replace('django__django-', '');
          html += '<th data-col="' + (ci + 1) + '"><a href="https://huggingface.co/datasets/princeton-nlp/SWE-bench_Verified/viewer/default/test?views%5B%5D=test&sql=SELECT+*+FROM+test+WHERE+instance_id+%3D+%27'+inst+'%27">' + short + '</a></th>';
        });
        html += '</tr></thead><tbody>';

        variants.forEach(v => {
          html += '<tr><td class="model-col sticky-cell" data-col="0">' + esc(shortLabel(v)) + '</td>';
          instances.forEach(inst => {
            const row = lookup[inst] && lookup[inst][v.key];
            if (row) {
              html += '<td style="color:' + toolColor(row.tools) + ';">' + trajLink(v, inst, row.tools, inst + ' · ' + shortLabel(v)) + '</td>';
            } else {
              html += '<td>-</td>';
            }
          });
          html += '</tr>';
        });

        html += '</tbody></table></div>';

        const rcMin = Math.min(...allRcValues);
        const rcMax = Math.max(...allRcValues);
        const rcSorted = allRcValues.slice().sort((a, b) => a - b);
        const rcBottom20Idx = Math.floor(rcSorted.length * 0.2);
        const rcTop20Idx = Math.ceil(rcSorted.length * 0.8);
        const rcBottomThreshold = rcBottom20Idx > 0 ? rcSorted[rcBottom20Idx - 1] : rcSorted[0];
        const rcTopThreshold = rcTop20Idx < rcSorted.length ? rcSorted[rcTop20Idx] : rcSorted[rcSorted.length - 1];
        const rcHeat = heatRamp(getThemeColors());
        function rcColor(val) {
          if (val >= rcBottomThreshold && val <= rcTopThreshold) return rcHeat.muted;
          return rcHeat.ramp(allRcValues.length > 1 ? (val - rcMin) / (rcMax - rcMin) : 0);
        }

        html += '<div class="sub-header">Non-Zero Return Codes</div>';
        html += '<div class="table-scroll" id="table-scroll-rc"><table class="sync-table"><thead><tr>';
        html += '<th class="model-col sticky-header" data-col="0">Model</th>';
        instances.forEach((inst, ci) => {
          const short = inst.replace('django__django-', '');
          html += '<th data-col="' + (ci + 1) + '"><a href="https://huggingface.co/datasets/princeton-nlp/SWE-bench_Verified/viewer/default/test?views%5B%5D=test&sql=SELECT+*+FROM+test+WHERE+instance_id+%3D+%27'+inst+'%27">' + short + '</a></th>';
        });
        html += '</tr></thead><tbody>';

        variants.forEach(v => {
          html += '<tr><td class="model-col sticky-cell" data-col="0">' + esc(shortLabel(v)) + '</td>';
          instances.forEach(inst => {
            const row = lookup[inst] && lookup[inst][v.key];
            if (row) {
              html += '<td style="color:' + rcColor(row.nonzero_rc) + ';">' + trajLink(v, inst, row.nonzero_rc, inst + ' · ' + shortLabel(v)) + '</td>';
            } else {
              html += '<td>-</td>';
            }
          });
          html += '</tr>';
        });

        html += '</tbody></table></div>';

        setHtml(panel, html);

        const scrollStatus = document.getElementById('table-scroll-status');
        const scrollTools = document.getElementById('table-scroll-tools');
        const scrollRc = document.getElementById('table-scroll-rc');
        const scrollables = [scrollStatus, scrollTools, scrollRc].filter(Boolean);
        let _scrollSyncing = false;
        scrollables.forEach(el => {
          if (!el) return;
          el.addEventListener('scroll', () => {
            if (_scrollSyncing) return;
            _scrollSyncing = true;
            scrollables.forEach(other => {
              if (other !== el) other.scrollLeft = el.scrollLeft;
            });
            requestAnimationFrame(() => { _scrollSyncing = false; });
          });
        });

        let _activeHighlight = null;
        function clearHighlight() {
          if (_activeHighlight) {
            _activeHighlight.forEach(td => td.classList.remove('table-col-highlight'));
            _activeHighlight = null;
          }
        }
        function highlight(cells) {
          _activeHighlight = cells;
          cells.forEach(td => td.classList.add('table-col-highlight'));
        }
        function highlightColumn(colIndex) {
          highlight([...panel.querySelectorAll('.sync-table tr')]
            .map(tr => tr.children[colIndex])
            .filter(Boolean));
        }
        // Rows line up across the three sync-tables, so a model row highlights everywhere.
        function highlightRow(rowIndex) {
          highlight([...panel.querySelectorAll('.sync-table')]
            .flatMap(t => [...(t.rows[rowIndex] ? t.rows[rowIndex].children : [])]));
        }
        panel.querySelectorAll('.sync-table td, .sync-table th').forEach(cell => {
          cell.addEventListener('click', () => {
            clearHighlight();
            const col = Array.prototype.indexOf.call(cell.parentNode.children, cell);
            if (col === 0) highlightRow(cell.parentNode.rowIndex);
            else highlightColumn(col);
          });
        });
        document.addEventListener('click', (e) => {
          if (!panel.contains(e.target)) clearHighlight();
        });
      }

      /* Model colors, marker colors, tooltip ink, and the chart font all come from
         the theme, so a flip re-renders rather than patching layouts: filter state
         survives (renderAll re-reads it) and nothing keeps a stale color. */
      window.__themeUpdateCharts = function() {
        chartFontFamily = getThemeColors().fontFamily;
        refreshModelColors();
        renderAll();
      };

      // Gutters and heights are derived from the viewport, so a rotation needs a
      // full re-render rather than just Plotly's width rescale.
      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(renderAll, 250);
      });

      initModelFilters();
      applyUrlFilter();
      renderAll();
    </script>
